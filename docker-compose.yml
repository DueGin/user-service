name: user-service

services:
  user-service:
    image: ${USER_SERVICE_IMAGE:?Set USER_SERVICE_IMAGE to the GHCR image tag}
    container_name: ${USER_SERVICE_CONTAINER_NAME:-user-service}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      POSTGRES_HOST: ${POSTGRES_HOST:?Set POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA:-public}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-}
      POSTGRES_URL_EXTRA_PARAMS: ${POSTGRES_URL_EXTRA_PARAMS:-}
    ports:
      - "${USER_SERVICE_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
