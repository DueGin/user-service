name: Deploy Test

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-test
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  build:
    name: Build test image
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.meta.outputs.image_name }}
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: meta
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          IMAGE_TAG="test-${GITHUB_SHA}"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/user_service?schema=public

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/user_service?schema=public
          JWT_SECRET: ci-jwt-secret
          JWT_REFRESH_SECRET: ci-jwt-refresh-secret

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image artifact
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.image_tag }}
          outputs: type=docker,dest=/tmp/user-service-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: user-service-image
          path: /tmp/user-service-image.tar
          retention-days: 1
          compression-level: 0

  push-image:
    name: Push test image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: user-service-image
          path: /tmp

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image tags
        env:
          IMAGE_NAME: ${{ needs.build.outputs.image_name }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          docker load --input /tmp/user-service-image.tar
          docker tag "$IMAGE_NAME:$IMAGE_TAG" "$IMAGE_NAME:test"
          docker push "$IMAGE_NAME:$IMAGE_TAG"
          docker push "$IMAGE_NAME:test"

  deploy:
    name: Deploy test
    runs-on: ubuntu-latest
    needs:
      - build
      - push-image
    environment: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          COMPOSE_DIR: ${{ vars.COMPOSE_DIR }}
        run: |
          set -eu

          missing=0
          for name in SSH_HOST SSH_USERNAME SSH_PASSWORD GHCR_USERNAME GHCR_TOKEN COMPOSE_DIR; do
            if [ -z "${!name:-}" ]; then
              echo "${name} is required"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Prepare remote compose directory
        uses: appleboy/ssh-action@v1.2.0
        env:
          COMPOSE_DIR: ${{ vars.COMPOSE_DIR }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: COMPOSE_DIR
          script: |
            set -eu

            if [ -z "${COMPOSE_DIR:-}" ]; then
              echo "COMPOSE_DIR is required"
              exit 1
            fi

            mkdir -p "$COMPOSE_DIR"

      - name: Upload Docker Compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: docker-compose.yml
          target: ${{ vars.COMPOSE_DIR }}
          overwrite: true

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.2.0
        env:
          COMPOSE_DIR: ${{ vars.COMPOSE_DIR }}
          DEPLOY_IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: COMPOSE_DIR,DEPLOY_IMAGE_TAG,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -eu

            if [ -z "${COMPOSE_DIR:-}" ]; then
              echo "COMPOSE_DIR is required"
              exit 1
            fi

            cd "$COMPOSE_DIR"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            export USER_SERVICE_IMAGE_TAG="$DEPLOY_IMAGE_TAG"
            docker compose config --quiet
            docker compose pull user-service
            docker compose run --rm user-service npx prisma migrate deploy
            docker compose up -d user-service
            docker image prune -f
