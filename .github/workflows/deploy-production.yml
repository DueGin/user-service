name: Deploy Production

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: "20"

jobs:
  deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image metadata
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "DEPLOY_IMAGE=${IMAGE_NAME}:production-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/user_service?schema=public

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/user_service?schema=public
          JWT_SECRET: ci-jwt-secret
          JWT_REFRESH_SECRET: ci-jwt-refresh-secret

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DEPLOY_IMAGE }}
            ${{ env.IMAGE_NAME }}:production
            ${{ env.IMAGE_NAME }}:latest

      - name: Prepare remote compose directory
        uses: appleboy/ssh-action@v1.2.0
        env:
          COMPOSE_DIR: ${{ vars.COMPOSE_DIR }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: COMPOSE_DIR
          script: |
            set -eu

            if [ -z "${COMPOSE_DIR:-}" ]; then
              echo "COMPOSE_DIR is required"
              exit 1
            fi

            mkdir -p "$COMPOSE_DIR"

      - name: Upload Docker Compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: docker-compose.yml
          target: ${{ vars.COMPOSE_DIR }}
          overwrite: true

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.2.0
        env:
          COMPOSE_DIR: ${{ vars.COMPOSE_DIR }}
          DEPLOY_IMAGE: ${{ env.DEPLOY_IMAGE }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: COMPOSE_DIR,DEPLOY_IMAGE,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -eu

            if [ -z "${COMPOSE_DIR:-}" ]; then
              echo "COMPOSE_DIR is required"
              exit 1
            fi

            cd "$COMPOSE_DIR"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            export USER_SERVICE_IMAGE="$DEPLOY_IMAGE"
            docker compose config --quiet
            docker compose pull user-service
            docker compose run --rm user-service npx prisma migrate deploy
            docker compose up -d user-service
            docker image prune -f
